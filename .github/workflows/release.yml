name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TDLIB_TAG: v1.8.62

jobs:
  build:
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache TDLib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libtd*
            /usr/local/lib/libtdjson*
            /usr/local/include/td
          key: tdlib-${{ env.TDLIB_TAG }}-${{ matrix.runner }}

      - name: Install build dependencies
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gperf libssl-dev zlib1g-dev

      - name: Build TDLib
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.TDLIB_TAG }} https://github.com/tdlib/td.git /tmp/tdlib-src
          cd /tmp/tdlib-src
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install

      - name: Build tgch_dump
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: '-ltde2e -ltdutils'
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o tgch_dump ./cmd/tgch_dump

      - name: Package artifact
        run: |
          ARCHIVE="tgch_dump-linux-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" tgch_dump config.example.yaml README.md LICENSE
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: tgch_dump-linux-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tar.gz'
